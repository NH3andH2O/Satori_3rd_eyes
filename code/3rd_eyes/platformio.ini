; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32_s3_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/git_version.py

monitor_speed = 115200
upload_speed = 921600

;分區表
board_build.arduino.partitions = partitions/n16r8.csv

;板子配置
board_build.arduino.memory_type = qio_opi
build_flags = 
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=5
    -D LOG_LOCAL_LEVEL=5
    -D USE_ESP_IDF_LOG
; 套件ld_flags為靜態檔案，重建IDF libs不會更新；DIAG_USE_EXTERNAL_LOG_WRAP後這些wrap已無實作
build_unflags =
    -Wl,--wrap=esp_log_write
    -Wl,--wrap=esp_log_writev
    -Wl,--wrap=log_printf
board_upload.flash_size = 16MB

;自訂IDF設定，首次套用會重新編譯Arduino IDF libs
custom_sdkconfig =
    # hybrid compile不套用memory_type，N16R8的OPI PSRAM需明確指定否則開機IllegalInstruction
    CONFIG_SPIRAM_MODE_OCT=y
    CONFIG_ESP_WIFI_11KV_SUPPORT=y
    CONFIG_ESP_WIFI_RRM_SUPPORT=y
    CONFIG_ESP_WIFI_WNM_SUPPORT=y
    CONFIG_ESP_WIFI_SCAN_CACHE=y
    # Insights已排除，其log hook無後端；不關閉會在PSRAM初始化時LoadProhibited
    CONFIG_DIAG_USE_EXTERNAL_LOG_WRAP=y
    CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
    CONFIG_ARDUINO_SELECTIVE_SPI=y
    CONFIG_ARDUINO_SELECTIVE_Wire=y
    CONFIG_ARDUINO_SELECTIVE_EEPROM=y
    CONFIG_ARDUINO_SELECTIVE_Preferences=y
    CONFIG_ARDUINO_SELECTIVE_Ticker=y
    CONFIG_ARDUINO_SELECTIVE_Update=y
    CONFIG_ARDUINO_SELECTIVE_FS=y
    CONFIG_ARDUINO_SELECTIVE_LittleFS=y
    CONFIG_ARDUINO_SELECTIVE_SPIFFS=y
    CONFIG_ARDUINO_SELECTIVE_Network=y
    CONFIG_ARDUINO_SELECTIVE_WiFi=y
    CONFIG_ARDUINO_SELECTIVE_NetworkClientSecure=y
    CONFIG_ARDUINO_SELECTIVE_HTTPClient=y
    CONFIG_ARDUINO_SELECTIVE_WebServer=y
    CONFIG_ARDUINO_SELECTIVE_DNSServer=y
    CONFIG_ARDUINO_SELECTIVE_ESPmDNS=y
    CONFIG_ARDUINO_SELECTIVE_AsyncUDP=y
    CONFIG_ARDUINO_SELECTIVE_ArduinoOTA=y
    # RainMaker/Insights的憑證嵌入在hybrid compile下會產生錯誤的.S路徑
    CONFIG_ARDUINO_SELECTIVE_RainMaker=n
    CONFIG_ARDUINO_SELECTIVE_Insights=n
    # ESP_SR依賴未被選入的ESP_I2S
    CONFIG_ARDUINO_SELECTIVE_ESP_SR=n

custom_component_remove =
    espressif/esp_rainmaker
    espressif/esp_insights

;依賴程式庫
lib_deps =
    madhephaestus/ESP32Servo@3.0.9
    lovyan03/LovyanGFX@1.2.7
    ESP32Async/ESPAsyncWebServer@3.8.1
    ESP32Async/AsyncTCP@3.4.9
    bblanchon/ArduinoJson@7.4.2

;異常解碼
monitor_filters = esp32_exception_decoder