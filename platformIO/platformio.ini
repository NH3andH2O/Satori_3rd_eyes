; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32_s3_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

;分區表
board_build.arduino.partitions = partitions/n16r8.csv

;板子配置
board_build.arduino.memory_type = qio_opi
build_flags = 
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_LOG_DEFAULT_LEVEL=3
    -D LOG_LOCAL_LEVEL=3
board_upload.flash_size = 16MB

;依賴程式庫
lib_deps =
    madhephaestus/ESP32Servo@3.0.9
    lovyan03/LovyanGFX@1.2.7
    ESP32Async/ESPAsyncWebServer@3.8.1
    ESP32Async/AsyncTCP@3.4.9
    bblanchon/ArduinoJson@7.4.2